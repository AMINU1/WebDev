<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Responsive Navbar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="brand">Logo</div>
      <nav class="nav">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Work</a>
        <a href="#">Contact</a>
      </nav>
      <button class="menu-toggle" aria-expanded="false">☰</button>
    </div>
  </header>

  <main class="container">
    <h1>Responsive Navigation</h1>
    <p>Resize the window to see the mobile menu behavior. This starter is CSS-first; the button is present for progressive enhancement.</p>
  </main>

  <script>
    // Minimal JS to toggle mobile nav (optional for students)
    const btn = document.querySelector('.menu-toggle');
    const nav = document.querySelector('.nav');
    btn.addEventListener('click', () => {
      const expanded = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', String(!expanded));
      nav.classList.toggle('open');
    });
  </script>
</body>
</html>
