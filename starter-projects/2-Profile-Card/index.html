<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Profile Card</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <img src="https://via.placeholder.com/120" alt="Profile photo" class="avatar">
    <h1>Jane Student</h1>
    <p class="role">Front-End Learner</p>
    <p class="bio">A short bio about the student. Loves creating clean and accessible UIs.</p>
    <p class="links">
      <a href="#">Website</a>
      <a href="#">Twitter</a>
    </p>
  </main>
</body>
</html>
