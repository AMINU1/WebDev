<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles.all.min.css">
    <head>
    <!-- 1. Core Font Awesome Styles (Required for layout and fonts) -->
    <link rel="stylesheet" href="https://cloudflare.com" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- 2. Your Brands Stylesheet (For social logos) -->
    <link rel="stylesheet" href="https://cloudflare.com" integrity="sha512-JvNYE/c3wl/dRKs3ZHX+QHe21Et1/ouedfAKJsQPB0XJ+QjVWipm2MVgK3BgrJbdTBXTg/r4rmY4nj6fuzWPyg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

</head>
<body>
    <div class="container">
    <h1>Login</h1>
    <form action="index.html" method="POST" id="myform"> 

        <!-- Email -->
        <label for="email">Enter Email:</label>
        <input type="email" placeholder="example@email.com.."
        name="email" id="email" class="email" required>

        <!-- Password -->
        <label for="password">Password:</label>
        <input type="password" placeholder="Please Enter Password.."
        name="" id="password" class="password" required>
        <!-- btn -->
        <button type="button" class="btn">Submit</button>

        <!-- social media  -->
        <div class="social">
            <p>Or login with social media</p>
            <div class="social-icons">
                <a href="#"><i class="fa-brands fa-facebook"></i>facebook</a>
                <a href="#"><i class="fa-brands fa-github"></i></i></a>
                <a href="#"><i class="fa-brands fa-google"></i></a>
               
            </div>
    </form>
</div>
</body>
</html>
